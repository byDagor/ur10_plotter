[project]
name = "ur10"
version = "0.1.0"
description = ""
authors = [
    {name = "David Gonzalez",email = "david@simplefoc.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "vpype (>=1.15.0,<2.0.0)",
    "cairosvg (>=2.8.2,<3.0.0)",
    "vpype-flow-imager @ git+https://github.com/serycjon/vpype-flow-imager.git",
    "reportlab (>=4.4.4,<5.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "numpy (<2.0)",
    "ur-rtde (>=1.6.2,<2.0.0)",
    "svg-path (>=7.0,<8.0)",
    "dearpygui (>=2.0,<3.0)"
]

[tool.poetry]
packages = [{include = "ur10", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.5,<0.15.0)"
]
